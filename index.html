<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>장애물 피하기</title>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #111; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 8px;
  }
  h1 { font-size: 20px; margin: 8px 0 0; }
  #hud { display: flex; gap: 18px; font-size: 14px; flex-wrap: wrap; justify-content: center; }
  #hud b { color: #6cf; }
  #rules, #controls { font-size: 13px; color: #aaa; text-align: center; max-width: 480px; }
  #stage {
    position: relative; width: 480px; height: 360px;
    max-width: 100%;
    background: #1b1b1b; border: 2px solid #333; border-radius: 8px;
    overflow: hidden; touch-action: none;
  }
  #player {
    position: absolute; width: 32px; height: 32px;
    background: #4a9eff; border-radius: 4px;
    bottom: 8px; left: 224px;
  }
  .obstacle {
    position: absolute; width: 28px; height: 28px;
    background: #ff5252; border-radius: 4px;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(0,0,0,0.72); text-align: center; padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 22px; font-weight: 700; }
  #overlay .sub { font-size: 13px; color: #bbb; }
  button {
    padding: 10px 18px; font-size: 14px; border: 0; border-radius: 6px;
    background: #4a9eff; color: #fff; cursor: pointer;
  }
  button:disabled { background: #555; cursor: default; }
  #state { font-size: 13px; color: #8f8; }
  #btnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* ===== 카드4: 보존 기록 표시 ===== */
  #persistView {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    justify-content: center; font-size: 13px; color: #cfe;
    background: #17202e; padding: 8px 12px; border-radius: 8px;
    border: 1px solid #2b3a52;
  }
  #persistView b { color: #6cf; }
  #persistView button { padding: 4px 10px; font-size: 12px; background: #2a3a55; }

  /* ===== 카드5: 선택권 ===== */
  #optionBar { font-size: 13px; color: #cfe; }
  #optionBar input { vertical-align: middle; margin-right: 4px; }

  /* ===== 카드3: 기록 패널 ===== */
  #recordPanel { width: 480px; max-width: 100%; font-size: 12px; margin-top: 4px; }
  #recordHead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  #recordHead button { padding: 4px 10px; font-size: 12px; }
  #recordTable { width: 100%; border-collapse: collapse; }
  #recordTable th, #recordTable td { border: 1px solid #333; padding: 3px 5px; text-align: center; }
  #recordTable th { background: #222; color: #6cf; }
  #summary { margin-top: 6px; color: #8f8; }

  /* ===== 카드5: 충돌 효과 애니메이션 ===== */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #stage.shake { animation: shake 0.12s linear 2; }

  @keyframes flash {
    0% { box-shadow: inset 0 0 0 4px rgba(255,60,60,0.0); }
    50% { box-shadow: inset 0 0 0 4px rgba(255,60,60,0.9); }
    100% { box-shadow: inset 0 0 0 4px rgba(255,60,60,0.0); }
  }
  #stage.flash { animation: flash 0.25s ease-out 1; }

  /* 움직임 감소 켜짐 → 애니메이션 전역 차단 (즉시 멈춤 보장) */
  body.reduce-motion #stage.shake,
  body.reduce-motion #stage.flash { animation: none !important; }
</style>
</head>
<body>
  <h1>장애물 피하기</h1>

  <!-- C03 규칙 -->
  <div id="rules">규칙: 위에서 떨어지는 빨간 장애물을 피해 30초 동안 생존하세요. 3번 부딪히면 실패입니다.</div>
  <!-- C04 조작 -->
  <div id="controls">조작: ← → (또는 A D) 이동 · Space/클릭 시작 · P 일시정지 · R 다시 시작</div>
  <!-- C05 상태 -->
  <div id="hud">
    <span>상태: <b id="state">대기</b></span>
    <span>남은 시간: <b id="time">30.0</b>s</span>
    <span>남은 목숨: <b id="lives">3</b></span>
    <span>난이도(장애물 속도): <b id="diffView">3.2</b></span>
  </div>

  <div id="stage">
    <div id="player"></div>
    <div id="overlay">
      <div class="big" id="ovTitle">준비</div>
      <div class="sub" id="ovSub">Space 또는 아래 버튼으로 시작하세요.</div>
      <button id="startBtn">시작</button>
    </div>
  </div>

  <div id="btnRow">
    <button id="pauseBtn" disabled>일시정지 (P)</button>
    <button id="restartBtn" disabled>다시 시작 (R)</button>
  </div>

  <!-- ===== 카드5: 선택권 ===== -->
  <div id="optionBar">
    <label>
      <input type="checkbox" id="motionToggle" />
      움직임 감소 (화면 흔들림·플래시 끄기)
    </label>
  </div>

  <!-- ===== 카드4: 보존 기록 ===== -->
  <div id="persistView">
    <span>최고 생존: <b id="bestTime">0.0</b>s</span>
    <span>총 플레이: <b id="totalPlays">0</b>회</span>
    <button id="resetPersistBtn">보존 기록 초기화</button>
  </div>

  <!-- ===== 카드3: 플레이 기록 ===== -->
  <div id="recordPanel">
    <div id="recordHead">
      <span>플레이 기록: <b id="recordCount">0</b> / 10</span>
      <button id="csvBtn">CSV 내보내기</button>
      <button id="clearBtn">기록 초기화</button>
    </div>
    <table id="recordTable">
      <thead>
        <tr><th>#</th><th>결과</th><th>남은시간</th><th>충돌</th><th>원인</th><th>난이도</th></tr>
      </thead>
      <tbody id="recordBody"></tbody>
    </table>
    <div id="summary">요약: 기록 없음</div>
  </div>

<script>
(() => {
  "use strict";

  /* =========================================================
     카드3: 난이도 설정 (이 값 하나만 바꿔서 10회씩 비교)
     ========================================================= */
  const DIFFICULTY = {
    OB_SPEED: 3.2
  };

  /* =========================================================
     카드4: 저장 정책 선언
     ========================================================= */
  const RESET_ON_NEW_GAME = ["timeLeft", "hits", "playerX", "obstacles"];
  const PERSIST_KEYS = ["bestTime", "totalPlays"];
  const STORAGE_KEY = "obstacle-game-v1";

  const DEFAULT_PERSIST = {
    bestTime: 0,
    totalPlays: 0
  };

  /* =========================================================
     카드5: 효과 정책 선언
     - EFFECT_EVENT: 효과를 줄 사건 (충돌에서만)
     - EFFECT_DURATION: 효과 지속(ms)
     ========================================================= */
  const EFFECT_EVENT = "collision";
  const EFFECT_DURATION = 250;
  const MOTION_KEY = "obstacle-game-reduce-motion";

  const STAGE_W = 480, STAGE_H = 360;
  const PLAYER_W = 32, PLAYER_H = 32;
  const OB_W = 28, OB_H = 28;
  const PLAYER_SPEED = 6;
  const DURATION = 30;
  const SPAWN_MS = 700;
  const TICK_MS = 50;
  const MAX_HITS = 3;

  // DOM
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const playerEl = $("player");
  const overlay = $("overlay");
  const ovTitle = $("ovTitle");
  const ovSub = $("ovSub");
  const startBtn = $("startBtn");
  const pauseBtn = $("pauseBtn");
  const restartBtn = $("restartBtn");
  const stateEl = $("state");
  const timeEl = $("time");
  const livesEl = $("lives");
  const diffView = $("diffView");
  const recordBody = $("recordBody");
  const recordCount = $("recordCount");
  const summaryEl = $("summary");
  const bestTimeEl = $("bestTime");
  const totalPlaysEl = $("totalPlays");
  const motionToggle = $("motionToggle");

  /* =========================================================
     카드4: 저장/불러오기 (빈 값·손상 값 안전 처리)
     ========================================================= */
  function loadPersist() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { ...DEFAULT_PERSIST };
      const parsed = JSON.parse(raw);
      if (typeof parsed !== "object" || parsed === null) {
        return { ...DEFAULT_PERSIST };
      }
      return {
        bestTime: Number.isFinite(parsed.bestTime) && parsed.bestTime >= 0
          ? parsed.bestTime : DEFAULT_PERSIST.bestTime,
        totalPlays: Number.isInteger(parsed.totalPlays) && parsed.totalPlays >= 0
          ? parsed.totalPlays : DEFAULT_PERSIST.totalPlays
      };
    } catch (e) {
      console.warn("저장값 손상, 기본값으로 복구:", e);
      return { ...DEFAULT_PERSIST };
    }
  }

  function savePersist(p) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
    } catch (e) {
      console.warn("저장 실패:", e);
    }
  }

  let persist = loadPersist();

  function renderPersist() {
    bestTimeEl.textContent = persist.bestTime.toFixed(1);
    totalPlaysEl.textContent = persist.totalPlays;
  }

  /* =========================================================
     카드5: 움직임 감소 설정 (localStorage 보존)
     ========================================================= */
  let reduceMotion = localStorage.getItem(MOTION_KEY) === "1";

  function applyMotionSetting() {
    document.body.classList.toggle("reduce-motion", reduceMotion);
    motionToggle.checked = reduceMotion;
  }

  // 효과 실행 (충돌에서만 호출)
  function playCollisionEffect() {
    if (reduceMotion) return;                 // C27: 켜져 있으면 실행 안 함
    if (state.phase !== "playing") return;    // 사건 조건: 진행 중일 때만

    stage.classList.add("shake");
    stage.classList.add("flash");

    // 효과 종료 (반복 방지)
    clearTimeout(playCollisionEffect._t);
    playCollisionEffect._t = setTimeout(() => {
      stage.classList.remove("shake");
      stage.classList.remove("flash");
    }, EFFECT_DURATION);
  }

  motionToggle.addEventListener("change", () => {
    reduceMotion = motionToggle.checked;
    localStorage.setItem(MOTION_KEY, reduceMotion ? "1" : "0");
    applyMotionSetting();
    // C27: 켜는 순간 진행 중인 효과도 즉시 제거
    if (reduceMotion) {
      clearTimeout(playCollisionEffect._t);
      stage.classList.remove("shake");
      stage.classList.remove("flash");
    }
  });

  /* =========================================================
     현재 판 상태 (저장 안 함 → 새 게임 시 초기화)
     ========================================================= */
  const initialState = () => ({
    phase: "ready",       // ready | playing | paused | win | lose
    timeLeft: DURATION,
    hits: 0,
    playerX: (STAGE_W - PLAYER_W) / 2,
    obstacles: [],
    loopId: null,
    spawnId: null,
    lastTs: 0
  });
  let state = initialState();

  /* =========================================================
     카드3: 플레이 기록 (10회 비교용, 메모리에만 보관)
     ========================================================= */
  const records = [];

  function recordRun(result, cause) {
    records.push({
      run: records.length + 1,
      result,
      timeLeft: +state.timeLeft.toFixed(2),
      hits: state.hits,
      cause,
      difficulty: DIFFICULTY.OB_SPEED
    });
    renderRecords();
  }

  function summarize() {
    if (records.length === 0) return null;
    const times = records.map((r) => r.timeLeft).sort((a, b) => a - b);
    const wins = records.filter((r) => r.result === "win").length;
    const mid = times.length % 2
      ? times[(times.length - 1) / 2]
      : (times[times.length / 2 - 1] + times[times.length / 2]) / 2;
    return {
      n: records.length,
      wins,
      winRate: +(wins / records.length * 100).toFixed(1),
      min: +times[0].toFixed(1),
      max: +times[times.length - 1].toFixed(1),
      median: +mid.toFixed(1)
    };
  }

  function renderRecords() {
    recordBody.innerHTML = "";
    records.forEach((r) => {
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td>${r.run}</td>` +
        `<td>${r.result === "win" ? "성공" : "실패"}</td>` +
        `<td>${r.timeLeft.toFixed(1)}</td>` +
        `<td>${r.hits}</td>` +
        `<td>${r.cause}</td>` +
        `<td>${r.difficulty}</td>`;
      recordBody.appendChild(tr);
    });
    recordCount.textContent = records.length;

    const s = summarize();
    summaryEl.textContent = s
      ? `요약: ${s.n}회 / 성공 ${s.wins}회 (${s.winRate}%) / 남은시간 범위 ${s.min}~${s.max}s / 중앙값 ${s.median}s`
      : "요약: 기록 없음";
  }

  function clearRecords() {
    records.length = 0;
    renderRecords();
  }

  function exportCSV() {
    if (records.length === 0) {
      alert("기록이 없습니다. 먼저 플레이하세요.");
      return;
    }
    const header = "run,result,timeLeft,hits,cause,difficulty\n";
    const rows = records.map((r) =>
      [r.run, r.result, r.timeLeft, r.hits, r.cause, r.difficulty].join(",")
    ).join("\n");
    const blob = new Blob([header + rows], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `plays_${DIFFICULTY.OB_SPEED}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* =========================================================
     렌더
     ========================================================= */
  function render() {
    playerEl.style.left = state.playerX + "px";
    stateEl.textContent = {
      ready: "대기", playing: "진행 중", paused: "일시정지",
      win: "성공", lose: "실패"
    }[state.phase];
    timeEl.textContent = state.timeLeft.toFixed(1);
    livesEl.textContent = Math.max(0, MAX_HITS - state.hits);
    diffView.textContent = DIFFICULTY.OB_SPEED;

    const existing = stage.querySelectorAll(".obstacle");
    existing.forEach((el) => el.remove());
    for (const ob of state.obstacles) {
      const el = document.createElement("div");
      el.className = "obstacle";
      el.style.left = ob.x + "px";
      el.style.top = ob.y + "px";
      stage.appendChild(el);
    }

    if (state.phase === "ready") {
      overlay.classList.remove("hidden");
      ovTitle.textContent = "준비";
      ovSub.textContent = "Space 또는 시작 버튼을 누르세요.";
      startBtn.disabled = false;
      startBtn.textContent = "시작";
      pauseBtn.disabled = true;
      pauseBtn.textContent = "일시정지 (P)";
      restartBtn.disabled = true;
    } else if (state.phase === "playing") {
      overlay.classList.add("hidden");
      pauseBtn.disabled = false;
      pauseBtn.textContent = "일시정지 (P)";
      restartBtn.disabled = true;
    } else if (state.phase === "paused") {
      overlay.classList.remove("hidden");
      ovTitle.textContent = "일시정지";
      ovSub.textContent = "P 또는 아래 버튼으로 재개하세요.";
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = "재개 (P)";
      restartBtn.disabled = false;
    } else if (state.phase === "win") {
      overlay.classList.remove("hidden");
      ovTitle.textContent = "성공!";
      ovSub.textContent = "30초 생존 성공. 다시 시작은 R 또는 버튼.";
      startBtn.disabled = true;
      pauseBtn.disabled = true;
      restartBtn.disabled = false;
    } else if (state.phase === "lose") {
      overlay.classList.remove("hidden");
      ovTitle.textContent = "실패";
      ovSub.textContent = "장애물에 3번 부딪혔습니다. 다시 시작은 R 또는 버튼.";
      startBtn.disabled = true;
      pauseBtn.disabled = true;
      restartBtn.disabled = false;
    }
  }

  /* =========================================================
     타이머
     ========================================================= */
  function clearTimers() {
    if (state.loopId) { clearInterval(state.loopId); state.loopId = null; }
    if (state.spawnId) { clearInterval(state.spawnId); state.spawnId = null; }
  }

  function startTimers() {
    clearTimers();
    state.lastTs = performance.now();
    state.loopId = setInterval(loop, TICK_MS);
    state.spawnId = setInterval(spawnObstacle, SPAWN_MS);
  }

  /* =========================================================
     시작 / 일시정지 / 재시작 / 종료
     ========================================================= */
  function startGame() {
    if (state.phase !== "ready") return;
    state.phase = "playing";
    startTimers();
    render();
  }

  function togglePause() {
    if (state.phase === "playing") {
      clearTimers();
      state.phase = "paused";
      render();
    } else if (state.phase === "paused") {
      state.phase = "playing";
      startTimers();
      render();
    }
  }

  // C22: 새 게임 → 현재 판 값만 초기화, persist(보존 기록)는 유지
  function restart() {
    if (state.phase !== "win" && state.phase !== "lose" && state.phase !== "paused") return;
    clearTimers();
    state = initialState();
    render();
    renderPersist();
  }

  function endGame(result) {
    clearTimers();
    state.phase = result;

    // ===== 카드4: 보존 기록 갱신 + 저장 (C23) =====
    const survived = +(DURATION - state.timeLeft).toFixed(2);
    persist.totalPlays += 1;
    if (survived > persist.bestTime) persist.bestTime = survived;
    savePersist(persist);
    renderPersist();

    // ===== 카드3: 실패 원인 구분 + 기록 =====
    let cause;
    if (result === "win") {
      cause = "생존";
    } else if (state.timeLeft > 20) {
      cause = "초반 충돌";
    } else if (state.timeLeft > 10) {
      cause = "중반 충돌";
    } else {
      cause = "후반 충돌";
    }
    recordRun(result, cause);

    render();
    console.log(JSON.stringify({
      result, timeLeft: +state.timeLeft.toFixed(2), hits: state.hits,
      difficulty: DIFFICULTY.OB_SPEED, ts: Date.now()
    }));
  }

  /* =========================================================
     게임 루프
     ========================================================= */
  function spawnObstacle() {
    const x = Math.random() * (STAGE_W - OB_W);
    state.obstacles.push({ x, y: -OB_H });
  }

  function loop() {
    if (state.phase !== "playing") return;
    const now = performance.now();
    const dt = (now - state.lastTs) / 1000;
    state.lastTs = now;

    state.timeLeft = Math.max(0, state.timeLeft - dt);

    for (const ob of state.obstacles) ob.y += DIFFICULTY.OB_SPEED;
    state.obstacles = state.obstacles.filter((ob) => ob.y < STAGE_H + OB_H);

    const px = state.playerX, py = STAGE_H - PLAYER_H - 8;
    const isHit = (ob) =>
      ob.x < px + PLAYER_W && ob.x + OB_W > px &&
      ob.y < py + PLAYER_H && ob.y + OB_H > py;

    const hitCount = state.obstacles.filter(isHit).length;
    if (hitCount > 0) {
      state.obstacles = state.obstacles.filter((ob) => !isHit(ob));
      state.hits += hitCount;
      playCollisionEffect();          // ← 카드5: 충돌에서만 1회 실행
      if (state.hits >= MAX_HITS) { endGame("lose"); return; }
    }

    if (state.timeLeft <= 0) { endGame("win"); return; }
    render();
  }

  /* =========================================================
     입력
     ========================================================= */
  function movePlayer(dir) {
    if (state.phase !== "playing") return;
    state.playerX = Math.max(0, Math.min(STAGE_W - PLAYER_W, state.playerX + dir * PLAYER_SPEED));
    render();
  }

  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;               // C12: 키 반복 무시
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") { e.preventDefault(); movePlayer(-1); }
    else if (k === "arrowright" || k === "d") { e.preventDefault(); movePlayer(1); }
    else if (e.code === "Space") {
      e.preventDefault();
      if (state.phase === "ready") startGame();
    } else if (k === "p") { e.preventDefault(); togglePause(); }
    else if (k === "r") { restart(); }
  });

  stage.addEventListener("pointerdown", (e) => {
    if (state.phase === "ready") { startGame(); return; }
    if (state.phase !== "playing") return;
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    movePlayer(x < state.playerX + PLAYER_W / 2 ? -1 : 1);
  });

  // C14: 탭 숨김/창 포커스 이탈 시 자동 일시정지
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state.phase === "playing") togglePause();
  });
  window.addEventListener("blur", () => {
    if (state.phase === "playing") togglePause();
  });

  // 버튼 이벤트
  startBtn.addEventListener("click", startGame);
  pauseBtn.addEventListener("click", togglePause);
  restartBtn.addEventListener("click", restart);
  $("csvBtn").addEventListener("click", exportCSV);
  $("clearBtn").addEventListener("click", clearRecords);
  $("resetPersistBtn").addEventListener("click", () => {
    persist = { ...DEFAULT_PERSIST };
    savePersist(persist);
    renderPersist();
  });

  // 초기 렌더
  applyMotionSetting();
  render();
  renderRecords();
  renderPersist();
})();
</script>
</body>
</html>
